{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: taskboard}
spec: 
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: taskboard-taskboard-backend, port: {number: 3019}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: taskboard-frontend, port: {number: 3030}}}}
{{- end }}
