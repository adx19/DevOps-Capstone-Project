services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "1910:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d taskboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  backend:
    build: ./backend
    environment:
      DATABASE_URL:  postgresql+psycopg://admin:admin123@postgres:5432/taskboard_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3010:3019"
  
  frontend:
    build: ./frontend
    depends_on: 
      - backend
    ports:
      - "1919:3030"
  
volumes:
    postgres-data:
  