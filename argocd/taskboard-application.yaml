apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adx19/DevOps-Capstone-Project.git
    targetRevision: main
    path: helm/taskboard
    helm:
      releaseName: taskboard-gitops
      values: |
        namespace: taskboard-gitops
        replicaCount: 2
        frontend:
          image: ghcr.io/adx19/taskboard-frontend
          tag: 645166eab5d14e765d867db30b450e8d48c96f7d
        backend:
          image: ghcr.io/adx19/taskboard-backend
          tag: 645166eab5d14e765d867db30b450e8d48c96f7d
        postgres:
          host: taskboard-postgres
          database: taskboard_db
          username: admin
          password: admin123
        ingress:
          enabled: false
        hpa:
          enabled: false
        monitoring:
          serviceMonitor:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard-gitops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
